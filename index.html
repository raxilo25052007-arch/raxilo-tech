<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Raxilo Tech — Reviews, Compare &amp; Reselling Deals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --surface-elevated: #e8effa;
      --text: #0b152b;
      --text-muted: #475569;
      --border: #cbd5e1;
      --blue-deep: #0b1f4d;
      --blue-primary: #0b2e7a;
      --blue-bright: #2563eb;
      --orange: #ff6b00;
      --orange-hover: #e65f00;
      --orange-soft: rgba(255, 107, 0, 0.12);
      --amazon-bg: #ff9900;
      --amazon-text: #111827;
      --flipkart-bg: #2874f0;
      --whatsapp-bg: #16a34a;
      --winner-gold: #f59e0b;
      --danger: #dc2626;
      --shadow: 0 8px 24px rgba(11, 31, 77, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    html[data-theme="dark"] {
      --bg: #060c1a;
      --surface: #0d162b;
      --surface-elevated: #15223d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23355b;
      --blue-primary: #3b82f6;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 92px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
    }

    .font-mono { font-family: 'JetBrains Mono', monospace; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.2s ease;
    }
    button:active { transform: scale(0.97); }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Top Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0b2e7a, #1e40af);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(11, 46, 122, 0.35);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .brand-title span { color: var(--orange); }
    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface-elevated);
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .badge-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--orange);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .search-bar-wrap {
      margin-top: 12px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 42px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--orange); }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--orange);
      pointer-events: none;
    }
    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--text-muted);
    }

    .category-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: none;
    }
    .category-chips::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      min-height: 38px;
    }
    .chip.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
    }

    /* Main Content */
    .main-section { padding: 18px 0; }

    /* Hero Banner */
    .hero-banner {
      border-radius: 22px;
      background: linear-gradient(125deg, #060c1a 0%, #0b2e7a 60%, #1e3a8a 100%);
      color: #fff;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .hero-banner::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,107,0,0.38) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--orange);
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      width: fit-content;
    }
    .hero-banner h1 { font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.15; }
    .hero-banner p { color: rgba(255,255,255,0.82); font-size: 0.9rem; max-width: 560px; }
    .hero-ctas { display: flex; flex-wrap: wrap; gap: 10px; z-index: 1; }

    .btn-primary {
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
    }
    .btn-primary:hover { background: var(--orange-hover); }

    .btn-outline-light {
      border: 1px solid rgba(255,255,255,0.55);
      color: #fff;
      font-weight: 600;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      min-height: 44px;
    }

    .btn-outline {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
    }
    .btn-outline.active {
      border-color: var(--orange);
      background: var(--orange-soft);
      color: var(--orange);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 14px;
      gap: 10px;
    }
    .section-header h2 { font-size: 1.25rem; }
    .section-sub { font-size: 0.8rem; color: var(--text-muted); }

    /* Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    /* Product Card */
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .product-card.compared { border: 2px solid var(--orange); }

    .card-media {
      position: relative;
      height: 185px;
      background: linear-gradient(140deg, #0b1f4d 0%, #173a8a 60%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      cursor: pointer;
    }
    .card-media img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .card-badges-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .card-badges-top > * { pointer-events: auto; }

    .pill {
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      font-family: 'JetBrains Mono', monospace;
    }
    .pill-blue { background: rgba(37, 99, 235, 0.92); color: #fff; }
    .pill-orange { background: var(--orange); color: #fff; }
    .pill-green { background: var(--whatsapp-bg); color: #fff; }
    .pill-gold { background: var(--winner-gold); color: #111827; }

    .bookmark-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.48);
      color: #fff;
      display: grid;
      place-items: center;
    }
    .bookmark-btn.saved { color: var(--orange); }

    .card-price-bar {
      position: absolute;
      bottom: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .price-box {
      background: rgba(6, 12, 26, 0.82);
      color: #fff;
      padding: 5px 10px;
      border-radius: 10px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .price-now { font-weight: 700; font-size: 0.98rem; }
    .price-old { font-size: 0.75rem; opacity: 0.65; text-decoration: line-through; }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .brand-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--orange);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .product-title {
      font-size: 1.12rem;
      font-weight: 700;
      cursor: pointer;
    }
    .product-tagline {
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    .rating-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .stars {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--winner-gold);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .stars span.score-text { color: var(--text); margin-left: 4px; }
    .lab-pill {
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--surface-elevated);
      color: var(--blue-primary);
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .specs-box {
      background: var(--surface-elevated);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.78rem;
    }
    .spec-line {
      display: flex;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spec-line strong { color: var(--text-muted); font-weight: 600; flex-shrink: 0; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }
    .card-actions .btn-primary { flex: 1; }

    /* Affiliate Buttons */
    .affiliate-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .affiliate-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-amazon {
      background: var(--amazon-bg);
      color: var(--amazon-text);
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 0.84rem;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-flipkart {
      background: var(--flipkart-bg);
      color: #fff;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 0.84rem;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-whatsapp {
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 11px;
      font-size: 0.88rem;
      min-height: 46px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-whatsapp .resell-tag {
      background: rgba(255,255,255,0.22);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Compare Screen */
    .verdict-banner {
      background: rgba(245, 158, 11, 0.14);
      border: 1.5px solid var(--winner-gold);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .verdict-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--winner-gold);
      color: #111827;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .compare-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .compare-slot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      position: relative;
    }
    .compare-slot-card.winner { border: 2px solid var(--winner-gold); }
    .compare-slot-card.empty {
      border: 1.5px dashed var(--orange);
      background: var(--orange-soft);
      justify-content: center;
      min-height: 205px;
      cursor: pointer;
    }
    .compare-slot-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slot-thumb {
      width: 100%;
      height: 72px;
      border-radius: 10px;
      background: linear-gradient(140deg, #0b1f4d, #173a8a);
      display: grid;
      place-items: center;
      padding: 6px;
    }

    .compare-matrix {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .matrix-row {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .matrix-row:last-child { border-bottom: none; }
    .matrix-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--orange);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 8px;
    }
    .matrix-cells {
      display: grid;
      gap: 8px;
    }
    .matrix-cell {
      background: var(--surface-elevated);
      border-radius: 10px;
      padding: 8px;
      font-size: 0.78rem;
    }
    .matrix-cell.best {
      background: var(--orange-soft);
      border: 1px solid rgba(255, 107, 0, 0.35);
      font-weight: 600;
    }
    .best-tag {
      display: block;
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--orange);
      margin-bottom: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Floating Compare Tray */
    .compare-tray {
      position: fixed;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 580px;
      background: var(--blue-deep);
      color: #fff;
      border: 1px solid rgba(255, 107, 0, 0.55);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      z-index: 35;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .bottom-nav-inner {
      max-width: 680px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      min-height: 52px;
    }
    .nav-item.active {
      color: var(--orange);
      background: var(--orange-soft);
    }
    .nav-badge {
      position: absolute;
      top: 4px;
      right: 18%;
      background: var(--orange);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 99px;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(6, 12, 26, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .modal-backdrop.open { display: flex; }

    @media (min-width: 680px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }

    .modal-sheet {
      background: var(--surface);
      color: var(--text);
      width: 100%;
      max-width: 660px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 24px 24px 0 0;
      border: 1px solid var(--border);
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    @media (min-width: 680px) {
      .modal-sheet { border-radius: 24px; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .score-bar-wrap { margin-bottom: 8px; }
    .score-bar-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }
    .score-track {
      height: 8px;
      border-radius: 99px;
      background: var(--surface-elevated);
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      background: var(--orange);
      border-radius: 99px;
    }

    .pros-cons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }
    @media (max-width: 520px) { .pros-cons-grid { grid-template-columns: 1fr; } }
    .pros-box {
      background: rgba(22, 163, 74, 0.1);
      border-radius: 14px;
      padding: 12px;
      font-size: 0.82rem;
    }
    .cons-box {
      background: rgba(220, 38, 38, 0.1);
      border-radius: 14px;
      padding: 12px;
      font-size: 0.82rem;
    }

    /* Profile & Admin Cards */
    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-field, .textarea-field {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }
    .textarea-field {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      min-height: 210px;
      resize: vertical;
    }

    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--blue-deep);
      color: #fff;
      border: 1px solid var(--orange);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 600;
      z-index: 80;
      display: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

      }[s]));

      const full = Math.floor(rating);
      const half = rating - full >= 0.35;
      let html = "";
      for (let i = 0; i < 5; i++) {
        if (i < full) html += "★";
        else if (i === full && half) html += "★";
        else html += "☆";
      }
      return `<div class="stars">${html} <span class="score-text">${Number(rating).toFixed(1)}/5</span></div>`;
    }

    function buildWhatsAppUrl(p) {
      const num = (state.whatsappOverride || p.whatsappNumber || "919876543210").replace(/\D/g, "");
      const msg = `Hi Raxilo Tech! I want to order via Reselling:\n• Product: ${p.brand} ${p.name}\n• Resell Price: ${formatInr(p.resellPriceInr)} (Listed: ${formatInr(p.priceInr)})\n• Specs: ${p.specs.ramStorage}\nPlease share stock & delivery details.`;
      return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
    }

    /* =========================================================================
       4. FILTERING & COMPARISON ENGINE
       ========================================================================= */
    function getFilteredProducts() {
      const q = state.search.trim().toLowerCase();
      return state.products.filter(p => {
        const catOk =
          state.category === "ALL" ||
          (state.category === "BEST_DEALS" ? p.isBestDeal : p.category === state.category);
        const searchOk = !q ||
          p.name.toLowerCase().includes(q) ||
          p.brand.toLowerCase().includes(q) ||
          p.tagline.toLowerCase().includes(q) ||
          p.specs.processor.toLowerCase().includes(q) ||
          p.specs.camera.toLowerCase().includes(q);
        return catOk && searchOk;
      });
    }

    function analyzeComparison(list) {
      if (list.length < 2) {
        return { winnerId: null, scores: {}, metricWinners: {}, verdict: "Select at least 2 smartphones/devices to view the side-by-side Raxilo Winner." };
      }
      const metrics = [
        { key: "display", label: "Display", val: p => p.specs.display, score: p => p.scores.display },
        { key: "processor", label: "Processor", val: p => p.specs.processor, score: p => p.scores.processor },
        { key: "memory", label: "RAM / Storage", val: p => p.specs.ramStorage, score: p => p.scores.memory },
        { key: "camera", label: "Camera", val: p => p.specs.camera, score: p => p.scores.camera },
        { key: "battery", label: "Battery", val: p => p.specs.battery, score: p => p.scores.battery },
        { key: "price", label: "Price", val: p => `${formatInr(p.priceInr)} (Resell ${formatInr(p.resellPriceInr)})`, score: p => -p.priceInr }
      ];

      const metricWinners = {};
      metrics.forEach(m => {
        const max = Math.max(...list.map(m.score));
        metricWinners[m.key] = list.filter(p => m.score(p) === max).map(p => p.id);
      });

      const scores = {};
      list.forEach(p => {
        const s = p.scores;
        scores[p.id] = Math.round(s.display * 0.18 + s.processor * 0.22 + s.memory * 0.14 + s.camera * 0.20 + s.battery * 0.16 + s.value * 0.10);
      });

      const sorted = [...list].sort((a, b) => (scores[b.id] - scores[a.id]) || (b.rating - a.rating));
      const winner = sorted[0];
      const winsCount = metrics.filter(m => metricWinners[m.key].includes(winner.id)).length;
      return {
        metrics,
        winnerId: winner.id,
        scores,
        metricWinners,
        verdict: `${winner.name} wins the Raxilo Lab Verdict (${scores[winner.id]}/100), leading in ${winsCount} of 6 categories.`
      };
    }

        </section>

        <div class="product-grid">
          ${deals.map(p => `
            <article class="panel-card" style="margin:0;">
              <div style="display:flex;gap:12px;align-items:center;">
                <div class="slot-thumb" style="width:84px;height:84px;flex-shrink:0;cursor:pointer;" onclick="openDetailModal('${p.id}')">
                  ${deviceArtworkHtml(p, 62)}
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;">
                    ${discountPercent(p) > 0 ? `<span class="pill pill-orange">${discountPercent(p)}% OFF</span>` : ""}
                    <span class="pill pill-green">Resell Ready</span>
                  </div>
                  <h3 style="font-size:1rem;cursor:pointer;" onclick="openDetailModal('${p.id}')">${escapeHtml(p.brand)} ${escapeHtml(p.name)}</h3>
                  <div style="margin-top:3px;">
                    <strong style="color:var(--blue-primary);">${formatInr(p.priceInr)}</strong>
                    ${p.originalPriceInr > p.priceInr ? `<span class="price-old" style="margin-left:5px;">${formatInr(p.originalPriceInr)}</span>` : ""}
                  </div>
                  <div style="font-size:0.78rem;color:var(--whatsapp-bg);font-weight:700;">
                    Reselling: ${formatInr(p.resellPriceInr)} (Save ${formatInr(p.priceInr - p.resellPriceInr)})
                  </div>
                </div>
              </div>
              ${affiliateButtonsHtml(p)}
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderProfile() {
      const saved = state.products.filter(p => state.bookmarks.includes(p.id));
      const prettyJson = JSON.stringify(state.products, null, 2);

      return `
        <div class="section-header">
          <div>
            <h2>Profile &amp; Admin Catalog</h2>
            <div class="section-sub">Theme preferences, reseller WhatsApp &amp; live JSON manager</div>
          </div>
        </div>

        <div class="panel-card">
          <h3>Appearance</h3>
          <div style="display:flex;gap:10px;">
            <button class="chip ${state.theme === "dark" ? "active" : ""}" onclick="applyTheme('dark');render()">🌙 Dark Tech Mode</button>
            <button class="chip ${state.theme === "light" ? "active" : ""}" onclick="applyTheme('light');render()">☀️ Light Mode</button>
          </div>
        </div>

        <div class="panel-card">
          <h3>Saved Bookmarks (${saved.length})</h3>
          ${saved.length === 0 ? `<p class="section-sub">Tap ★ on any product card to save it here.</p>` : saved.map(p => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-elevated);cursor:pointer;" onclick="openDetailModal('${p.id}')">
              <div><strong>${escapeHtml(p.name)}</strong> <span class="section-sub">• ${formatInr(p.priceInr)}</span></div>
              <span style="color:var(--orange);font-weight:700;">View →</span>
            </div>
          `).join("")}
        </div>

        <div class="panel-card">
          <h3>WhatsApp Reselling Business Number</h3>
          <p class="section-sub">Set your default WhatsApp number (with country code, e.g. 919876543210) for all Reselling Order buttons.</p>
          <input type="tel" id="waOverrideInput" class="input-field" value="${escapeHtml(state.whatsappOverride)}" placeholder="919876543210" />
          <button class="btn-primary" style="background:var(--whatsapp-bg);" onclick="saveWhatsappOverride()">💾 Save WhatsApp Number</button>
        </div>

        <div class="panel-card">
          <h3>Quick Add New Product</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <input id="addBrand" class="input-field" placeholder="Brand (e.g. Nothing)" />
            <input id="addName" class="input-field" placeholder="Model Name *" />
            <select id="addCategory" class="input-field">
              <option value="MOBILES">Mobiles</option>
              <option value="LAPTOPS">Laptops</option>
              <option value="GADGETS">Gadgets</option>
            </select>
            <input id="addPrice" type="number" class="input-field" placeholder="Price INR *" />
            <input id="addResell" type="number" class="input-field" placeholder="Resell Price INR" />
            <input id="addCpu" class="input-field" placeholder="Processor" />
            <input id="addCam" class="input-field" placeholder="Camera" />
            <input id="addBat" class="input-field" placeholder="Battery" />
          </div>
          <button class="btn-primary" onclick="addQuickProduct()">+ Add Product to Catalog</button>
        </div>

        <div class="panel-card">
          <h3>Admin JSON Catalog Editor</h3>
          <p class="section-sub">Edit the JSON array directly to update phones, prices, or affiliate URLs.</p>
          <textarea id="jsonEditorArea" class="textarea-field">${escapeHtml(prettyJson)}</textarea>
          <div style="display:flex;gap:10px;">
            <button class="btn-primary" style="flex:1;" onclick="applyJsonFromEditor()">Apply &amp; Save JSON</button>
            <button class="btn-outline" onclick="resetCatalog()">↺ Reset Default</button>
          </div>
        </div>
      `;
    }

    function saveWhatsappOverride() {
      const val = document.getElementById("waOverrideInput").value.replace(/\D/g, "");
      state.whatsappOverride = val;
      localStorage.setItem(STORAGE_KEYS.WHATSAPP, val);
      showToast("Reselling WhatsApp number saved!");
    }

    function addQuickProduct() {
      const brand = document.getElementById("addBrand").value.trim();
      const name = document.getElementById("addName").value.trim();
      const category = document.getElementById("addCategory").value;
      const price = parseInt(document.getElementById("addPrice").value, 10);
      const resell = parseInt(document.getElementById("addResell").value, 10) || Math.round(price * 0.93);
      const cpu = document.getElementById("addCpu").value.trim() || "Flagship SoC";
      const cam = document.getElementById("addCam").value.trim() || "50MP OIS Camera";
      const bat = document.getElementById("addBat").value.trim() || "5000 mAh Fast Charge";

      if (!brand || !name || !price || price <= 0) {
        showToast("Enter Brand, Model Name, and valid Price.");
        return;
      }

      const newProd = {
        id: "rax-custom-" + Date.now(),
        name,
        brand,
        category,
        imageUrl: "",
        rating: 4.7,
        reviewCount: 1,
        priceInr: price,
        originalPriceInr: Math.round(price * 1.12),
        resellPriceInr: resell,
        isBestDeal: true,
        tagline: `${brand} flagship with ${cpu}`,
        specs: { display: "6.7\" 120Hz AMOLED", processor: cpu, ramStorage: "12GB RAM / 256GB", camera: cam, battery: bat },
        scores: { display: 91, processor: 92, memory: 90, camera: 89, battery: 90, value: 93 },
        reviewSummary: `Added via Raxilo Tech Catalog Manager.`,
        videoReviewUrl: `https://www.youtube.com/results?search_query=${encodeURIComponent(brand + " " + name + " Review")}`,
        pros: ["Strong value for money", "Ready for direct reselling"],
        cons: ["Limited launch stock"],
        amazonUrl: `https://www.amazon.in/s?k=${encodeURIComponent(brand + " " + name)}&tag=raxilotech-21`,
        flipkartUrl: `https://www.flipkart.com/search?q=${encodeURIComponent(brand + " " + name)}&affid=raxilotech`,
        whatsappNumber: state.whatsappOverride || "919876543210"
      };

      state.products.unshift(newProd);
      localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(state.products));
      showToast(`${name} added to catalog!`);
      render();
    }

    function applyJsonFromEditor() {
      try {
        const parsed = JSON.parse(document.getElementById("jsonEditorArea").value);
        if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("Must be a non-empty JSON array.");
        state.products = parsed;
        localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(parsed));
        showToast(`Catalog updated (${parsed.length} products)!`);
        render();
      } catch (err) {
        showToast("Invalid JSON: " + err.message);
      }
    }

    function resetCatalog() {
      state.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
      localStorage.removeItem(STORAGE_KEYS.PRODUCTS);
      showToast("Catalog reset to default products.");
      render();
    }

    /* =========================================================================
       8. MASTER RENDER
       ========================================================================= */
    function render() {
      const main = document.getElementById("appMain");
      if (state.tab === "home") main.innerHTML = renderHome();
      else if (state.tab === "reviews") main.innerHTML = renderReviews();
      else if (state.tab === "compare") main.innerHTML = renderCompare();
      else if (state.tab === "deals") main.innerHTML = renderDeals();
      else main.innerHTML = renderProfile();

      const cmpCount = state.compareIds.length;
      const dealsCount = state.products.filter(p => p.isBestDeal || discountPercent(p) > 0).length;

      const hdrBadge = document.getElementById("headerCompareBadge");
      const navBadge = document.getElementById("navCompareBadge");
      hdrBadge.style.display = cmpCount > 0 ? "grid" : "none";
      navBadge.style.display = cmpCount > 0 ? "block" : "none";
      hdrBadge.textContent = cmpCount;
      navBadge.textContent = cmpCount;
      document.getElementById("navDealsBadge").textContent = dealsCount;

      const tray = document.getElementById("compareTray");
      const showTray = (state.tab === "home" || state.tab === "reviews") && cmpCount >= 2;
      tray.style.display = showTray ? "flex" : "none";
      if (showTray) {
        document.getElementById("compareTrayText").textContent = `${cmpCount} devices ready to compare`;
      }
    }

    render();
  </script>
</body>
</html>
